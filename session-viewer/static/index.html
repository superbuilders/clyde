<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clyde Session Viewer</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/full.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    .msg-content pre { background: rgba(0,0,0,.35); padding: .75rem 1rem; border-radius: .5rem; overflow-x: auto; margin: .5rem 0; }
    .msg-content code { font-family: 'SF Mono','Fira Code','Cascadia Code',monospace; font-size: .84em; }
    .msg-content :not(pre) > code { background: rgba(0,0,0,.2); padding: .1em .35em; border-radius: .25rem; }
    .msg-content p { margin: .4em 0; }
    .msg-content h1,.msg-content h2,.msg-content h3 { margin: .7em 0 .2em; font-weight: 700; }
    .msg-content h1 { font-size: 1.4em; } .msg-content h2 { font-size: 1.2em; } .msg-content h3 { font-size: 1.05em; }
    .msg-content ul,.msg-content ol { padding-left: 1.5rem; margin: .4em 0; }
    .msg-content ul { list-style: disc; } .msg-content ol { list-style: decimal; }
    .msg-content li { margin: .2em 0; }
    .msg-content table { border-collapse: collapse; margin: .5rem 0; width: 100%; font-size: .9em; }
    .msg-content th,.msg-content td { border: 1px solid rgba(255,255,255,.12); padding: .3rem .6rem; text-align: left; }
    .msg-content th { background: rgba(255,255,255,.06); font-weight: 600; }
    .msg-content blockquote { border-left: 3px solid rgba(255,255,255,.25); padding-left: 1rem; margin: .5em 0; opacity: .85; }
    .msg-content a { color: oklch(.72 .16 250); text-decoration: underline; }
    .msg-content hr { border-color: rgba(255,255,255,.1); margin: .75em 0; }
    .nice-scroll::-webkit-scrollbar { width: 5px; }
    .nice-scroll::-webkit-scrollbar-track { background: transparent; }
    .nice-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen bg-base-300">

<div x-data="sessionViewer()" x-init="init()" class="flex h-screen">

  <!-- ─── Left sidebar: session list ─── -->
  <div class="w-96 min-w-80 flex flex-col bg-base-200 border-r border-base-300">

    <!-- Header & controls -->
    <div class="p-3 border-b border-base-300 space-y-2">
      <div class="flex items-center gap-2">
        <h1 class="text-lg font-bold flex-1">🔍 Sessions</h1>
        <button class="btn btn-xs btn-ghost" @click="loadSessions()" title="Refresh">⟳</button>
        <button class="btn btn-xs btn-primary" @click="showNewModal = true" title="New session">+ New</button>
      </div>
      <!-- Search -->
      <input type="text" x-model="search" placeholder="Search sessions…"
             class="input input-sm input-bordered w-full" />
      <!-- Filters row -->
      <div class="flex gap-1.5 flex-wrap">
        <select x-model="filterProject" class="select select-xs select-bordered">
          <option value="">All projects</option>
          <template x-for="p in uniqueProjects" :key="p">
            <option :value="p" x-text="p"></option>
          </template>
        </select>
        <select x-model="filterStatus" class="select select-xs select-bordered">
          <option value="">All status</option>
          <option value="running">Running</option>
          <option value="needs_reply">Needs reply</option>
          <option value="stopped">Stopped</option>
        </select>
        <select x-model="sortBy" class="select select-xs select-bordered">
          <option value="recent">Recent</option>
          <option value="messages">Most msgs</option>
          <option value="project">Project</option>
        </select>
      </div>
      <div class="text-xs opacity-60" x-text="filteredSessions.length + ' of ' + sessions.length + ' sessions'"></div>
    </div>

    <!-- Session list -->
    <div class="flex-1 overflow-y-auto nice-scroll">
      <template x-for="s in filteredSessions" :key="s.id + s.cwd">
        <div @click="selectSession(s)"
             :class="{'bg-primary/15 border-l-2 border-primary': selected?.id === s.id && selected?.cwd === s.cwd}"
             class="p-3 border-b border-base-300 cursor-pointer hover:bg-base-300/50 transition-colors">
          <div class="flex items-center gap-1.5 mb-1">
            <span class="font-semibold text-sm" x-text="s.project"></span>
            <span x-show="s.branch" class="badge badge-xs badge-outline opacity-70" x-text="s.branch"></span>
            <span x-show="s.running" class="badge badge-xs badge-success">●</span>
            <span x-show="s.viewer_agent" class="badge badge-xs badge-info">agent</span>
            <span x-show="s.agent_busy" class="badge badge-xs badge-warning animate-pulse">busy</span>
            <span x-show="s.needs_reply" class="badge badge-xs badge-accent">reply</span>
          </div>
          <div class="text-xs opacity-60 mb-1" x-text="s.user + ' · ' + formatTime(s.last_modified) + ' · ' + s.message_count + ' msgs'"></div>
          <div class="text-xs opacity-50 line-clamp-2" x-text="s.preview || '(empty session)'"></div>
        </div>
      </template>
      <div x-show="filteredSessions.length === 0 && !loading" class="p-6 text-center opacity-50">
        No sessions found
      </div>
      <div x-show="loading" class="p-6 text-center">
        <span class="loading loading-spinner loading-sm"></span>
      </div>
    </div>
  </div>

  <!-- New session modal (must be inside x-data scope) -->
  <dialog class="modal" :class="showNewModal && 'modal-open'">
    <div class="modal-box">
      <h3 class="font-bold text-lg mb-3">New Session</h3>
      <select x-model="newSessionCWD" class="select select-bordered w-full mb-3">
        <option value="">Select project…</option>
        <template x-for="p in projects" :key="p.path">
          <option :value="p.path" x-text="p.name + (p.branch ? ' (' + p.branch + ')' : '') + ' — ' + p.path"></option>
        </template>
      </select>
      <div class="modal-action">
        <button class="btn btn-ghost" @click="showNewModal = false">Cancel</button>
        <button class="btn btn-primary" @click="createSession()" :disabled="!newSessionCWD">Create</button>
      </div>
    </div>
    <form method="dialog" class="modal-backdrop" @click="showNewModal = false"></form>
  </dialog>

  <!-- ─── Main area: message view ─── -->
  <div class="flex-1 flex flex-col min-w-0">
    <!-- No session selected -->
    <template x-if="!selected">
      <div class="flex-1 flex items-center justify-center text-base-content/30">
        <div class="text-center">
          <div class="text-5xl mb-3">🤖</div>
          <div class="text-lg">Select a session to view</div>
          <div class="text-sm mt-1 opacity-60" x-text="sessions.length + ' sessions discovered'"></div>
        </div>
      </div>
    </template>

    <!-- Session selected -->
    <template x-if="selected">
      <div class="flex flex-col h-full">
        <!-- Top bar -->
        <div class="px-4 py-2.5 border-b border-base-300 bg-base-200 flex items-center gap-2">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2">
              <span class="font-bold" x-text="selected.project"></span>
              <span x-show="selected.branch" class="badge badge-sm badge-outline" x-text="selected.branch"></span>
              <span x-show="selected.viewer_agent && agentBusy" class="badge badge-sm badge-warning animate-pulse">⚡ Agent working…</span>
              <span x-show="selected.viewer_agent && !agentBusy" class="badge badge-sm badge-success">Agent idle</span>
            </div>
            <div class="text-xs opacity-50 truncate" x-text="selected.cwd + '  ·  ' + selected.id"></div>
          </div>
          <!-- Message type toggles -->
          <div class="flex gap-0.5">
            <template x-for="t in ['user','assistant','thinking','tools','compaction','diagnostic']" :key="t">
              <button @click="toggleType(t)"
                      :class="enabledTypes[t] ? 'btn-active btn-primary' : 'btn-ghost opacity-40'"
                      class="btn btn-xs" x-text="typeLabels[t]"></button>
            </template>
          </div>
          <button x-show="selected.viewer_agent" @click="stopAgent()"
                  class="btn btn-xs btn-error btn-outline" title="Stop agent">⏹ Stop</button>
        </div>

        <!-- Messages -->
        <div class="flex-1 overflow-y-auto nice-scroll p-4 space-y-3" x-ref="msgContainer">
          <div x-show="loadingMsgs" class="text-center py-6">
            <span class="loading loading-spinner loading-md"></span>
          </div>
          <template x-for="msg in messages" :key="msg.filename">
            <div>
              <!-- Tool-use: collapsible -->
              <template x-if="msg.type === 'tool-use'">
                <details open class="bg-base-300/30 rounded-lg my-1 group">
                  <summary class="flex items-center gap-2 px-3 py-2 text-xs font-mono cursor-pointer select-none hover:bg-base-300/50 rounded-lg list-none [&::-webkit-details-marker]:hidden">
                    <span class="transition-transform group-open:rotate-90">▶</span>
                    <span class="text-warning">🔧 Tool Call</span>
                    <span class="opacity-50 truncate" x-text="toolPreview(msg.content)"></span>
                  </summary>
                  <div class="px-3 pb-2 border-t border-base-300/50">
                    <div class="msg-content text-xs mt-2" x-html="renderMarkdown(msg.content)"></div>
                  </div>
                </details>
              </template>
              <!-- Tool-result: collapsible, plain text -->
              <template x-if="msg.type === 'tool-result'">
                <details open class="bg-base-300/30 rounded-lg my-1 group">
                  <summary class="flex items-center gap-2 px-3 py-2 text-xs font-mono cursor-pointer select-none hover:bg-base-300/50 rounded-lg list-none [&::-webkit-details-marker]:hidden">
                    <span class="transition-transform group-open:rotate-90">▶</span>
                    <span class="text-info">📋 Tool Result</span>
                    <span class="opacity-50 truncate" x-text="toolPreview(msg.content)"></span>
                  </summary>
                  <div class="px-3 pb-2 border-t border-base-300/50">
                    <pre class="text-xs mt-2 whitespace-pre-wrap break-words font-mono opacity-80" x-text="msg.content"></pre>
                  </div>
                </details>
              </template>
              <!-- Thinking: collapsible -->
              <template x-if="msg.type === 'thinking'">
                <details open class="bg-base-300/30 rounded-lg my-1 group">
                  <summary class="flex items-center gap-2 px-3 py-2 text-xs cursor-pointer select-none hover:bg-base-300/50 rounded-lg list-none [&::-webkit-details-marker]:hidden">
                    <span class="transition-transform group-open:rotate-90">▶</span>
                    <span class="text-secondary">💭 Thinking</span>
                    <span class="opacity-50 truncate" x-text="msg.content.substring(0, 80) + '…'"></span>
                  </summary>
                  <div class="px-3 pb-2 border-t border-base-300/50">
                    <div class="msg-content text-sm opacity-80 mt-2" x-html="renderMarkdown(msg.content)"></div>
                  </div>
                </details>
              </template>
              <!-- Compaction: not collapsible -->
              <template x-if="msg.type === 'compaction'">
                <div class="bg-accent/10 border border-accent/20 rounded-lg my-2 px-4 py-3">
                  <div class="text-xs font-semibold text-accent mb-2">📦 Compaction Summary</div>
                  <div class="msg-content text-sm" x-html="renderMarkdown(msg.content)"></div>
                </div>
              </template>
              <!-- Diagnostic: inline small -->
              <template x-if="msg.type === 'diagnostic'">
                <div class="text-xs opacity-40 font-mono px-2 py-1" x-text="msg.content.substring(0, 200)"></div>
              </template>
              <!-- User message -->
              <template x-if="msg.type === 'user'">
                <div class="chat chat-end">
                  <div class="chat-bubble chat-bubble-primary">
                    <div class="msg-content" x-html="renderMarkdown(msg.content.replace(/^\*\*You:\*\*\s*/,''))"></div>
                  </div>
                </div>
              </template>
              <!-- Assistant message -->
              <template x-if="msg.type === 'assistant'">
                <div class="chat chat-start">
                  <div class="chat-bubble chat-bubble-neutral max-w-4xl">
                    <div class="msg-content" x-html="renderMarkdown(msg.content)"></div>
                  </div>
                </div>
              </template>
            </div>
          </template>
          <!-- Busy indicator -->
          <div x-show="selected?.viewer_agent && agentBusy" class="flex items-center gap-2 py-2 px-4 opacity-60">
            <span class="loading loading-dots loading-sm"></span>
            <span class="text-sm">Agent is working…</span>
          </div>
        </div>

        <!-- Reply box -->
        <div class="border-t border-base-300 bg-base-200 p-3">
          <div class="flex gap-2">
            <textarea x-model="replyText" @keydown.meta.enter="sendReply()" @keydown.ctrl.enter="sendReply()"
                      placeholder="Send a message… (⌘+Enter to send)"
                      class="textarea textarea-bordered flex-1 min-h-[3rem] max-h-32 text-sm"
                      :disabled="sending" rows="2"></textarea>
            <button @click="sendReply()" class="btn btn-primary self-end"
                    :disabled="!replyText.trim() || sending">
              <span x-show="!sending">Send</span>
              <span x-show="sending" class="loading loading-spinner loading-sm"></span>
            </button>
          </div>
          <div x-show="sendError" class="text-error text-xs mt-1" x-text="sendError"></div>
        </div>
      </div>
    </template>
  </div>
</div>



<script>
function sessionViewer() {
  return {
    sessions: [],
    selected: null,
    messages: [],
    loading: false,
    loadingMsgs: false,
    search: '',
    filterProject: '',
    filterStatus: '',
    sortBy: 'recent',
    enabledTypes: {
      'user': true, 'assistant': true, 'thinking': true,
      'tools': true, 'compaction': true, 'diagnostic': false
    },
    typeLabels: {
      'user': '👤', 'assistant': '🤖', 'thinking': '💭',
      'tools': '🔧', 'compaction': '📦', 'diagnostic': '🔬'
    },
    replyText: '',
    sending: false,
    sendError: '',
    pollTimer: null,
    statusTimer: null,
    lastFilename: '',
    agentBusy: false,
    showNewModal: false,
    projects: [],
    newSessionCWD: '',

    async init() {
      await this.loadSessions();
      await this.loadProjects();
      // Refresh session list every 15s
      setInterval(() => this.loadSessions(), 15000);
    },

    async loadSessions() {
      this.loading = true;
      try {
        const r = await fetch('/api/sessions');
        this.sessions = await r.json();
      } catch(e) { console.error('Failed to load sessions:', e); }
      this.loading = false;
    },

    async loadProjects() {
      try {
        const r = await fetch('/api/projects');
        this.projects = await r.json();
      } catch(e) { console.error(e); }
    },

    get uniqueProjects() {
      return [...new Set(this.sessions.map(s => s.project))].sort();
    },

    get filteredSessions() {
      let list = [...this.sessions];
      if (this.search) {
        const q = this.search.toLowerCase();
        list = list.filter(s =>
          s.preview?.toLowerCase().includes(q) ||
          s.project?.toLowerCase().includes(q) ||
          s.branch?.toLowerCase().includes(q) ||
          s.id?.toLowerCase().includes(q) ||
          s.user?.toLowerCase().includes(q)
        );
      }
      if (this.filterProject) list = list.filter(s => s.project === this.filterProject);
      if (this.filterStatus === 'running') list = list.filter(s => s.running);
      if (this.filterStatus === 'needs_reply') list = list.filter(s => s.needs_reply);
      if (this.filterStatus === 'stopped') list = list.filter(s => !s.running);
      if (this.sortBy === 'messages') list.sort((a,b) => b.message_count - a.message_count);
      else if (this.sortBy === 'project') list.sort((a,b) => a.project.localeCompare(b.project));
      // 'recent' is default from server
      return list;
    },

    async selectSession(s) {
      this.selected = s;
      this.messages = [];
      this.lastFilename = '';
      this.agentBusy = s.agent_busy || false;
      this.sendError = '';
      this.replyText = '';
      await this.loadMessages(false);
      this.startPolling();
      this.$nextTick(() => this.scrollToBottom());
    },

    async loadMessages(incremental) {
      if (!this.selected) return;
      if (!incremental) this.loadingMsgs = true;
      const typeKeys = Object.entries(this.enabledTypes).filter(([,v]) => v).map(([k]) => k);
      // Expand 'tools' virtual toggle into both wire types
      const idx = typeKeys.indexOf('tools');
      if (idx !== -1) { typeKeys.splice(idx, 1, 'tool-use', 'tool-result'); }
      const types = typeKeys.join(',');
      let url = `/api/sessions/${encodeURIComponent(this.selected.id)}/messages?cwd=${encodeURIComponent(this.selected.cwd)}&types=${types}`;
      if (incremental && this.lastFilename) url += `&after=${encodeURIComponent(this.lastFilename)}`;
      try {
        const r = await fetch(url);
        const msgs = await r.json() || [];
        if (incremental) {
          if (msgs && msgs.length > 0) {
            this.messages = [...this.messages, ...msgs];
            this.lastFilename = msgs[msgs.length - 1].filename;
            this.$nextTick(() => this.scrollToBottom());
          }
        } else {
          this.messages = msgs || [];
          if (this.messages.length > 0) {
            this.lastFilename = this.messages[this.messages.length - 1].filename;
          }
        }
      } catch(e) { console.error(e); }
      this.loadingMsgs = false;
    },

    startPolling() {
      this.stopPolling();
      this.pollTimer = setInterval(() => this.loadMessages(true), 3000);
      this.statusTimer = setInterval(() => this.pollStatus(), 4000);
    },

    stopPolling() {
      if (this.pollTimer) { clearInterval(this.pollTimer); this.pollTimer = null; }
      if (this.statusTimer) { clearInterval(this.statusTimer); this.statusTimer = null; }
    },

    async pollStatus() {
      if (!this.selected) return;
      try {
        const r = await fetch(`/api/sessions/${encodeURIComponent(this.selected.id)}/status?cwd=${encodeURIComponent(this.selected.cwd)}`);
        const data = await r.json();
        this.selected.viewer_agent = data.viewer_agent;
        this.agentBusy = data.busy;
      } catch(e) {}
    },

    toggleType(t) {
      this.enabledTypes[t] = !this.enabledTypes[t];
      // Full reload with new types
      this.lastFilename = '';
      this.loadMessages(false);
    },

    async sendReply() {
      if (!this.replyText.trim() || !this.selected || this.sending) return;
      this.sending = true;
      this.sendError = '';
      try {
        const r = await fetch(`/api/sessions/${encodeURIComponent(this.selected.id)}/messages`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ cwd: this.selected.cwd, content: this.replyText.trim() })
        });
        const data = await r.json();
        if (!r.ok) {
          this.sendError = data.error || 'Send failed';
        } else {
          this.replyText = '';
          this.selected.viewer_agent = true;
          this.agentBusy = true;
          // Poll faster after sending
          setTimeout(() => this.loadMessages(true), 1500);
        }
      } catch(e) { this.sendError = e.message; }
      this.sending = false;
    },

    async stopAgent() {
      if (!this.selected) return;
      try {
        await fetch(`/api/sessions/${encodeURIComponent(this.selected.id)}/stop`, { method: 'POST' });
        this.selected.viewer_agent = false;
        this.agentBusy = false;
      } catch(e) { console.error(e); }
    },

    async createSession() {
      if (!this.newSessionCWD) return;
      try {
        const r = await fetch('/api/sessions/new', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ cwd: this.newSessionCWD })
        });
        const data = await r.json();
        if (r.ok) {
          this.showNewModal = false;
          await this.loadSessions();
          // Select the newly created session
          const s = this.sessions.find(s => s.id === data.session_id && s.cwd === data.cwd);
          if (s) this.selectSession(s);
        }
      } catch(e) { console.error(e); }
    },

    scrollToBottom() {
      const c = this.$refs.msgContainer;
      if (c) c.scrollTop = c.scrollHeight;
    },

    formatTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      const now = new Date();
      const diff = now - d;
      if (diff < 60000) return 'just now';
      if (diff < 3600000) return Math.floor(diff/60000) + 'm ago';
      if (diff < 86400000) return Math.floor(diff/3600000) + 'h ago';
      if (diff < 604800000) return Math.floor(diff/86400000) + 'd ago';
      return d.toLocaleDateString();
    },

    toolPreview(content) {
      const line = content.split('\n')[0] || '';
      return line.substring(0, 80);
    },

    renderMarkdown(content) {
      if (!content) return '';
      try {
        return marked.parse(content, { breaks: true, gfm: true });
      } catch(e) {
        return '<pre>' + this.escHtml(content) + '</pre>';
      }
    },

    escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  };
}
</script>
</body>
</html>
