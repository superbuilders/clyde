#cloud-config
# Bonnie M2 — first boot of the single box.
#
# Scope is deliberately small compared to v1: ONE Unix user (`bonnie`), one
# systemd unit, no per-user agentd, no provisioning units, no repo sync. M3
# makes users real; M6 adds repos.
#
# Everything here is idempotent enough to survive a reboot, because the data
# volume persists across instance replacement and must not be reformatted.

package_update: true
packages:
  - tmux
  - git
  - jq
  - curl
  - unzip
  - ripgrep
  - build-essential
  # M4 sharing: setfacl/getfacl. Absent from the base AMI, so a fresh box
  # cannot grant a share without it. See PLAN.md §4 (M4).
  - acl
  # M6: how a user gets GitHub access. Each person runs `gh auth login` once
  # from an agent session and the resulting token carries their own access —
  # every repo in every org they belong to, and nothing else. Bonnie stores no
  # GitHub credential of its own and keeps no list of who may see what, because
  # GitHub already does both. From Ubuntu's own repos rather than GitHub's apt
  # source: one less signing key and third-party repo on the box, and nothing
  # here needs a version newer than 24.04 ships.
  - gh
  - amazon-cloudwatch-agent

write_files:
  # ── CloudWatch agent ────────────────────────────────────────────────────
  - path: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
    permissions: "0644"
    owner: root:root
    content: |
      ${cloudwatch_agent_config}

  # ── the web unit ────────────────────────────────────────────────────────
  - path: /etc/systemd/system/bonnie-web.service
    permissions: "0644"
    owner: root:root
    content: |
      ${systemd_unit}

  # The privileged half of self-shipping. Root-owned 0755 so a member of
  # bonnie-ship can run it through sudo but cannot rewrite it.
  - path: /usr/local/sbin/bonnie-install
    permissions: "0755"
    owner: root:root
    content: |
      ${bonnie_install}

  # The unprivileged half of the CI ship path. Root-owned 0755 like
  # bonnie-install: bonnie-ci must be able to run it and must not be able to
  # rewrite it, or "root never executes anything from the build directory"
  # would be true only in the letter.
  - path: /usr/local/bin/bonnie-stage
    permissions: "0755"
    owner: root:root
    content: |
      ${bonnie_stage}

  # 0440 root:root, which sudo requires — it ignores a group- or
  # world-writable drop-in rather than failing loudly.
  - path: /etc/sudoers.d/bonnie-ship
    permissions: "0440"
    owner: root:root
    content: |
      ${sudoers_bonnie_ship}

  # Deny the instance role to human users. Without this, any user — or any
  # agent acting on one's behalf — can read Bonnie's own secrets from IMDS,
  # which defeats the point of per-user Unix accounts.
  - path: /etc/bonnie/imds.nft
    permissions: "0644"
    owner: root:root
    content: |
      ${imds_nft}

  - path: /etc/systemd/system/bonnie-imds-guard.service
    permissions: "0644"
    owner: root:root
    content: |
      ${imds_guard_unit}

  # ── boot-time setup, run once by the bonnie-setup unit ──────────────────
  #
  # A script rather than a pile of runcmd lines so it is readable, re-runnable
  # and greppable in the journal when it fails.
  - path: /usr/local/sbin/bonnie-setup
    permissions: "0750"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      exec 2>&1

      REGION="${aws_region}"
      DEV="${data_volume_by_id}"
      BUCKET="${release_bucket}"
      PREFIX="${release_prefix}"
      VERSION="${release_version}"
      WEB_SECRET="${web_secret_name}"
      AGENT_SECRET="${agent_secret_name}"

      echo "== bonnie-setup starting =="

      # 1. The AWS CLI. Ubuntu's apt awscli is v1 and too old; use v2.
      if ! command -v aws >/dev/null; then
        tmp=$(mktemp -d)
        curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "$tmp/awscli.zip"
        unzip -q "$tmp/awscli.zip" -d "$tmp"
        "$tmp/aws/install"
        rm -rf "$tmp"
      fi
      aws --version

      # 2. The data volume. Format ONLY if it has no filesystem — an instance
      #    replacement reattaches a volume full of session transcripts and
      #    reformatting it would be the single most destructive thing here.
      echo "== waiting for $DEV =="
      for i in $(seq 1 60); do [[ -e "$DEV" ]] && break; sleep 2; done
      [[ -e "$DEV" ]] || { echo "data volume $DEV never appeared"; exit 1; }

      if ! blkid "$DEV" >/dev/null 2>&1; then
        echo "== no filesystem on $DEV; creating ext4 =="
        mkfs.ext4 -L bonnie-data "$DEV"
      else
        echo "== $DEV already has a filesystem; NOT touching it =="
      fi

      mkdir -p /srv/bonnie
      grep -q '^LABEL=bonnie-data' /etc/fstab || \
        echo 'LABEL=bonnie-data /srv/bonnie ext4 defaults,noatime,nofail 0 2' >>/etc/fstab
      mountpoint -q /srv/bonnie || mount /srv/bonnie
      mountpoint -q /srv/bonnie

      # 3. The single Unix user. M2 intentionally shares one account.
      if ! id bonnie >/dev/null 2>&1; then
        # No login shell via ssh (there is no ssh key and no public IP); the shell
        # is real because agents exec it for run_bash.
        useradd --system --create-home --home-dir /srv/bonnie/home --shell /bin/bash bonnie
      fi
      mkdir -p /srv/bonnie/home /run/bonnie
      chown -R bonnie:bonnie /srv/bonnie/home /run/bonnie
      chmod 0750 /srv/bonnie/home

      # A project directory for the agent to work in, so a fresh box has
      # somewhere to start a session. discoverProjectDirs() finds ~/code/*.
      mkdir -p /srv/bonnie/home/code/scratch/.clyde/sessions
      chown -R bonnie:bonnie /srv/bonnie/home/code
      sudo -u bonnie git -C /srv/bonnie/home/code/scratch rev-parse --git-dir >/dev/null 2>&1 || \
        sudo -u bonnie git -C /srv/bonnie/home/code/scratch init -q

      # 4. The release. Tarball contains ./bonnie and ./clyde at the root.
      mkdir -p "/opt/bonnie/versions/$VERSION"
      tmp=$(mktemp -d)
      aws s3 cp "s3://$BUCKET/$PREFIX/$VERSION.tar.gz" "$tmp/r.tar.gz" --region "$REGION"
      aws s3 cp "s3://$BUCKET/$PREFIX/$VERSION.tar.gz.sha256" "$tmp/r.sha256" --region "$REGION"
      ( cd "$tmp" && echo "$(cat r.sha256)  r.tar.gz" | sha256sum -c - )
      tar -xzf "$tmp/r.tar.gz" -C "/opt/bonnie/versions/$VERSION"
      rm -rf "$tmp"
      ln -sfn "/opt/bonnie/versions/$VERSION" /opt/bonnie/current
      chmod 0755 /opt/bonnie/current/bonnie /opt/bonnie/current/clyde
      /opt/bonnie/current/bonnie --help >/dev/null 2>&1 || true

      # 5. The environment file. Secrets come from Secrets Manager at boot and
      #    land in a 0640 root:bonnie file — never in user-data, never in argv,
      #    never in Terraform state.
      web=$(aws secretsmanager get-secret-value --secret-id "$WEB_SECRET" \
              --query SecretString --output text --region "$REGION")
      agent=$(aws secretsmanager get-secret-value --secret-id "$AGENT_SECRET" \
              --query SecretString --output text --region "$REGION")

      mkdir -p /etc/bonnie
      umask 027
      {
        echo "BONNIE_AUTH=oidc"
        echo "BONNIE_OIDC_ISSUER=${oidc_issuer}"
        echo "BONNIE_OIDC_CLIENT_ID=${oidc_client_id}"
        echo "BONNIE_OIDC_REDIRECT_URL=https://${domain_name}/auth/callback"
        echo "BONNIE_ALLOWED_EMAILS=${allowed_emails}"
        echo "BONNIE_COOKIE_SECURE=true"
        echo "BONNIE_OIDC_CLIENT_SECRET=$(jq -r .BONNIE_OIDC_CLIENT_SECRET <<<"$web")"
        echo "BONNIE_SESSION_KEY=$(jq -r .BONNIE_SESSION_KEY <<<"$web")"
      } >/etc/bonnie/web.env
      chown root:bonnie /etc/bonnie/web.env
      chmod 0640 /etc/bonnie/web.env

      # 5b. The agent's own config. clyde refuses to start without it
      #     (~/.clyde/config, a flat KEY=VALUE file). It is NOT web.env: the web
      #     server never needs the model credential, only the agent does, so it
      #     lives in the bonnie user's home at 0600 and is owned by bonnie.
      #
      #     Keys come from the agent secret. TS_AGENT_API_URL points at the
      #     TrueFoundry gateway; the model credential is never echoed to logs.
      install -d -m 0700 -o bonnie -g bonnie /srv/bonnie/home/.clyde
      umask 077
      {
        echo "TS_AGENT_API_KEY=$(jq -r .TS_AGENT_API_KEY <<<"$agent")"
        echo "TS_AGENT_API_URL=$(jq -r .TS_AGENT_API_URL <<<"$agent")"
        echo "TS_AGENT_MODEL_ID=$(jq -r .TS_AGENT_MODEL_ID <<<"$agent")"
        brave=$(jq -r '.BRAVE_SEARCH_API_KEY // empty' <<<"$agent")
        [ -n "$brave" ] && echo "BRAVE_SEARCH_API_KEY=$brave"
      } >/srv/bonnie/home/.clyde/config
      chown bonnie:bonnie /srv/bonnie/home/.clyde/config
      chmod 0600 /srv/bonnie/home/.clyde/config
      umask 027

      # Prove the agent can actually load its config, rather than discovering
      # at first message that it cannot. Failure here must be loud.
      if ! sudo -u bonnie /opt/bonnie/current/clyde --version >/tmp/clyde-version.log 2>&1; then
        echo "ERROR: agent cannot start — see /tmp/clyde-version.log" >&2
        cat /tmp/clyde-version.log >&2
        exit 1
      fi
      echo "agent ok: $(cat /tmp/clyde-version.log)"

      unset web agent brave

      # No git identity or credential is configured here. The service account
      # does not do the work — since M3 each request runs as the requesting
      # user, in that user's own home. A shared token would hand every user
      # the same GitHub access, which is the thing multi-user mode exists to
      # avoid. Users authenticate as themselves via the github-login skill,
      # and configure user.name/user.email to their own liking.

      # 5.5 Unix accounts for the named users (M3). Idempotent, so re-running
      # setup or adding a name to provision_emails is safe. A user on the
      # allowlist with no account here fails closed at request time rather than
      # sharing the service account, which is the whole point of M3.
      install -d -m 0751 -o root -g root /srv/bonnie/users
      IFS=',' read -ra EMAILS <<< "${provision_emails}"
      for e in "$${EMAILS[@]}"; do
        e=$(echo "$e" | tr -d '[:space:]')
        [ -n "$e" ] || continue
        BONNIE_SERVICE_HOME=/srv/bonnie/home /opt/bonnie/current/bonnie provision --email "$e" \
          || echo "WARN: provision $e failed"
      done

      # 6. CloudWatch agent, then the web unit.
      /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
        -a fetch-config -m ec2 -s \
        -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json || \
        echo "WARN: cloudwatch agent config failed"

      # 5.9 Go toolchain, so the box can build its own releases (self-shipping).
      #
      # Not from apt: 24.04 ships Go 1.22 and both go.mod files require 1.24.0,
      # so the distro package cannot build this repo at all. Pinned to the same
      # version the laptop uses, so a binary built here and one built there come
      # out of the same compiler; bump this one variable to move both.
      #
      # The checksum is not decoration. This toolchain produces the binary that
      # later runs as root, so an unverified download would be the weakest link
      # in the whole chain.
      GO_VERSION=1.24.0
      GO_SHA256=dea9ca38a0b852a74e81c26134671af7c0fbe65d81b0dc1c5bfe22cf7d4c8858
      if [ ! -x /usr/local/go/bin/go ]; then
        echo "installing go $GO_VERSION"
        t=$(mktemp -d)
        if curl -fsSL -o "$t/go.tgz" \
             "https://go.dev/dl/go$GO_VERSION.linux-amd64.tar.gz" &&
           echo "$GO_SHA256  $t/go.tgz" | sha256sum -c - >/dev/null; then
          rm -rf /usr/local/go
          tar -C /usr/local -xzf "$t/go.tgz"
          echo "go installed: $(/usr/local/go/bin/go version)"
        else
          echo "WARN: go download or checksum failed; the box cannot self-ship"
        fi
        rm -rf "$t"
      fi
      # On PATH for every login shell, so an agent session just finds it.
      printf 'export PATH=$PATH:/usr/local/go/bin:$HOME/go/bin\n' \
        >/etc/profile.d/go.sh
      chmod 0644 /etc/profile.d/go.sh

      # 5.10 The self-shipping group. Empty by default: an account does not
      # imply the right to ship, and membership is granted deliberately with
      # `usermod -aG bonnie-ship <user>`.
      getent group bonnie-ship >/dev/null || groupadd --system bonnie-ship

      # 5.11 The CI staging account. Downloads and unpacks releases that
      # GitHub Actions published, so that root does neither. Deliberately not
      # in bonnie-ship: it has no sudo at all. CI's privilege comes from the
      # SSM document it is allowed to run, not from anything this user holds.
      #
      # --system matters twice over. It keeps the uid below 1000, which is the
      # boundary /etc/bonnie/imds.nft uses, so this account can assume the
      # instance role and read the release bucket while human users still
      # cannot. And --shell /usr/sbin/nologin means the account is not a way
      # to get a shell if someone does manage to su to it.
      getent passwd bonnie-ci >/dev/null || \
        useradd --system --home-dir /srv/bonnie/ci --shell /usr/sbin/nologin bonnie-ci
      install -d -m 0750 -o bonnie-ci -g bonnie-ci /srv/bonnie/ci /srv/bonnie/ci/.ship

      systemctl daemon-reload
      # Before bonnie-web, so the metadata hole is shut before any agent can
      # be spawned through it.
      systemctl enable --now bonnie-imds-guard.service || \
        echo "WARN: IMDS guard failed — users can reach the instance role"
      systemctl enable --now bonnie-web.service
      echo "== bonnie-setup done =="

  - path: /etc/systemd/system/bonnie-setup.service
    permissions: "0644"
    owner: root:root
    content: |
      [Unit]
      Description=Bonnie first-boot setup
      After=network-online.target cloud-init.service
      Wants=network-online.target
      ConditionPathExists=!/srv/bonnie/.setup-complete

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/bonnie-setup
      ExecStartPost=/bin/touch /srv/bonnie/.setup-complete
      StandardOutput=journal
      StandardError=journal
      TimeoutStartSec=900

      [Install]
      WantedBy=multi-user.target

runcmd:
  - [systemctl, daemon-reload]
  - [systemctl, enable, --now, bonnie-setup.service]

output: { all: "| tee -a /var/log/cloud-init-output.log" }
